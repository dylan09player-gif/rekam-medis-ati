version: '3.8'

services:
  rekam-medis-ati:
    build: .
    container_name: rekam-medis-ati
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    volumes:
      - ./data:/app/data

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: rekam-medis-tunnel
    restart: always
    command: tunnel --url http://rekam-medis-ati:3000
    depends_on:
      - rekam-medis-ati

